[versions]
# Confirm each version with its release page before you raise it.
kotlin = "2.4.20"
ktor = "3.6.0"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
logback = "1.6.3"
typesafe-config = "1.4.9"
# The compile version of kit/jvm-mongo, the version of the Spring Boot 3.3
# BOM (design decision D22).
mongodb-driver-sync = "5.0.1"
# The newest 5.x version of mongodb-driver-sync. Confirmed on Maven Central
# on 2026-09-21 (repo1.maven.org/maven2/org/mongodb/mongodb-driver-sync/
# maven-metadata.xml). kit/jvm-mongo runs its test suite against this
# version too (issue #11, step 6).
mongodb-sync-newest = "5.12.0"
# The monitor reader of design decision D1 and D22 (issue #16). The same
# version as mongodb-driver-sync above, so both driver artifacts of the
# monorepo stay in step. Confirmed on Maven Central on 2026-09-22
# (repo1.maven.org/maven2/org/mongodb/mongodb-driver-kotlin-coroutine/):
# version 5.0.1 exists for this artifact too.
mongodb-driver-kotlin-coroutine = "5.0.1"
sqlite-jdbc = "3.53.4.0"
# The version of the three kit publications of JitPack (design decision
# D25, issue #37). A release bump (D26, issue #39) changes this entry
# only.
octometer-kit = "0.2.0"
# Test-only versions of kit/jvm-mongo. Each one is the current release on
# Maven Central, confirmed on 2026-09-21.
junit = "6.1.3"
mockito = "5.23.0"
testcontainers = "2.0.5"
# The compile version of kit/jvm-spring (design decision D17, issue #69):
# the Spring Framework version of the Spring Boot 3.4.1 dependency list.
# Confirmed on 2026-09-26 from the "v3.4.1" tag of spring-projects/spring-boot
# on GitHub: gradle.properties holds "springFrameworkVersion=6.2.1", and
# spring-boot-project/spring-boot-dependencies/build.gradle holds the
# Jakarta Servlet entry "6.0.0" for the same tag.
spring-framework = "6.2.1"
jakarta-servlet-api = "6.0.0"

[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-auto-head-response = { module = "io.ktor:ktor-server-auto-head-response", version.ref = "ktor" }
# Issue #31: the CallLogging plugin, with a format of the method and the
# path only (D11, D15). Same ktor version as every other Ktor artifact
# of this catalog.
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
# Test-only: the virtual-time scheduler of issue #17 (design decision D6).
# Confirmed on Maven Central on 2026-09-22 (repo1.maven.org/maven2/org/
# jetbrains/kotlinx/kotlinx-coroutines-test/1.11.0/), the same version as
# kotlinx-coroutines-core above.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafe-config" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
mongodb-driver-kotlin-coroutine = { module = "org.mongodb:mongodb-driver-kotlin-coroutine", version.ref = "mongodb-driver-kotlin-coroutine" }
# Test-only libraries of the kit modules. Dependabot reads each entry
# through this [libraries] table (issue #138).
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
# The compile version of kit/jvm-mongo (design decision D22). Dependabot
# reads this entry, and the ignore rule of .github/dependabot.yml stops
# an update of it.
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb-driver-sync" }
# The compile version of kit/jvm-spring (design decision D17, issue #69).
# Dependabot reads each entry through this table (issue #138).
spring-web = { module = "org.springframework:spring-web", version.ref = "spring-framework" }
spring-webmvc = { module = "org.springframework:spring-webmvc", version.ref = "spring-framework" }
spring-test = { module = "org.springframework:spring-test", version.ref = "spring-framework" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta-servlet-api" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
