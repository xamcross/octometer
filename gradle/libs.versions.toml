[versions]
# Confirm each version with its release page before you raise it.
kotlin = "2.4.20"
ktor = "3.6.0"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
logback = "1.6.3"
typesafe-config = "1.4.9"
# The compile version of kit/jvm-mongo, the version of the Spring Boot 3.3
# BOM (design decision D22).
mongodb-driver-sync = "5.0.1"
# The newest 5.x version of mongodb-driver-sync. Confirmed on Maven Central
# on 2026-09-21 (repo1.maven.org/maven2/org/mongodb/mongodb-driver-sync/
# maven-metadata.xml). kit/jvm-mongo runs its test suite against this
# version too (issue #11, step 6).
mongodb-sync-newest = "5.12.0"
sqlite-jdbc = "3.53.4.0"
# Test-only versions of kit/jvm-mongo. Each one is the current release on
# Maven Central, confirmed on 2026-09-21.
junit = "6.1.3"
mockito = "5.23.0"
testcontainers = "2.0.5"

[libraries]
# Test-only libraries of kit/jvm-mongo. Dependabot reads each entry
# through this [libraries] table (issue #138).
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
# The compile version of kit/jvm-mongo (design decision D22). Dependabot
# reads this entry, and the ignore rule of .github/dependabot.yml stops
# an update of it.
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb-driver-sync" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafe-config" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
