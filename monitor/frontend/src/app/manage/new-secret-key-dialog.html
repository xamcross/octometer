<button type="button" class="btn btn-small new-secret-key-trigger" #triggerButton (click)="open()">
  New secret key
</button>

<dialog #dialogEl (close)="onDialogClose()" [attr.aria-labelledby]="headingId">
  @if (newSecretKey(); as secretKey) {
    <h2 [id]="headingId">New secret key for {{ app().name }}</h2>
    <p class="form-hint key-warning">Copy the secret key now. It shows one time.</p>

    <div class="field">
      <label for="new-secret-key-value">Secret key</label>
      <div class="key-row">
        <input id="new-secret-key-value" type="text" readonly [value]="secretKey" />
        <button type="button" class="btn btn-small" (click)="copySecretKey()">
          {{ copyDone() ? 'Copied' : 'Copy' }}
        </button>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-primary" (click)="done()">Done</button>
    </div>
  } @else {
    <h2 [id]="headingId">Replace the secret key of {{ app().name }}?</h2>
    <p>The old secret key stops working at once. This cannot be undone.</p>

    @if (errorMessage(); as message) {
      <p [id]="errorId" class="form-error">⚠ {{ message }}</p>
    }

    <div class="actions">
      <button type="button" class="btn cancel" #cancelButton (click)="cancel()">Cancel</button>
      <button
        type="button"
        class="btn btn-danger confirm-rotate"
        [disabled]="pending()"
        (click)="confirmRotate()"
      >
        Replace the secret key
      </button>
    </div>
  }
</dialog>
