<form (submit)="onSubmit($event)">
  <div class="field">
    <label for="add-app-name">Name</label>
    <input id="add-app-name" type="text" required [value]="name()" (input)="onNameInput($event)" />
  </div>

  <div class="field">
    <label for="add-app-origins">Origins (one per line)</label>
    <textarea
      id="add-app-origins"
      required
      [value]="origins()"
      (input)="onOriginsInput($event)"
      [attr.aria-describedby]="
        errorMessage() ? 'add-app-origins-hint add-app-error' : 'add-app-origins-hint'
      "
      [attr.aria-invalid]="errorMessage() ? 'true' : null"
    ></textarea>
    <p id="add-app-origins-hint" class="form-hint">{{ originsHint }}</p>
  </div>

  @if (errorMessage(); as message) {
    <p id="add-app-error" class="form-error">{{ message }}</p>
  }

  <button type="submit" class="btn btn-primary" [disabled]="pending()">Add app</button>
</form>

@if (keys(); as created) {
  <section class="panel keys-panel" aria-live="polite">
    <h3>App key and secret key</h3>

    <div class="field">
      <label for="add-app-key">App key</label>
      <div class="key-row">
        <input id="add-app-key" type="text" readonly [value]="created.appKey" />
        <button type="button" class="btn btn-small" (click)="copyAppKey()">
          {{ copyAppKeyDone() ? 'Copied' : 'Copy' }}
        </button>
      </div>
    </div>

    <div class="field">
      <label for="add-app-secret-key">Secret key</label>
      <div class="key-row">
        <input id="add-app-secret-key" type="text" readonly [value]="created.secretKey" />
        <button type="button" class="btn btn-small" (click)="copySecretKey()">
          {{ copySecretKeyDone() ? 'Copied' : 'Copy' }}
        </button>
      </div>
    </div>

    <p class="form-hint key-warning">Copy the secret key now. It shows one time.</p>

    <div class="field">
      <label for="add-app-script-tag">Tracker script</label>
      @if (trackerHash(); as hash) {
        <pre id="add-app-script-tag"><code>{{ scriptTag(created.appKey, hash) }}</code></pre>
      } @else {
        <p id="add-app-script-tag" class="form-hint">The script is not built on this instance.</p>
      }
    </div>
  </section>
}
