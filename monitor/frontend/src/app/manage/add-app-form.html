<form (submit)="onSubmit($event)">
  <div class="field">
    <label for="add-app-name">Name</label>
    <input id="add-app-name" type="text" required [value]="name()" (input)="onNameInput($event)" />
  </div>

  <div class="field">
    <label for="add-app-connection-string">Connection string</label>
    <input
      id="add-app-connection-string"
      type="password"
      autocomplete="new-password"
      required
      [value]="connectionString()"
      (input)="onConnectionStringInput($event)"
      [attr.aria-describedby]="
        errorMessage()
          ? 'add-app-connection-string-hint add-app-error'
          : 'add-app-connection-string-hint'
      "
      [attr.aria-invalid]="errorMessage() ? 'true' : null"
    />
    <p id="add-app-connection-string-hint" class="form-hint">{{ connectionStringHint }}</p>
  </div>

  <div class="field">
    <label for="add-app-path-patterns">Route patterns (one per line)</label>
    <textarea
      id="add-app-path-patterns"
      [value]="pathPatterns()"
      (input)="onPathPatternsInput($event)"
      [attr.aria-describedby]="
        errorMessage() ? 'add-app-path-patterns-hint add-app-error' : 'add-app-path-patterns-hint'
      "
    ></textarea>
    <p id="add-app-path-patterns-hint" class="form-hint">
      {{ pathPatternsHint }} Example: <code>/</code>, <code>/articles/*</code>,
      <code>/history/:id</code>, each on its own line.
    </p>
  </div>

  @if (errorMessage(); as message) {
    <p id="add-app-error" class="form-error">{{ message }}</p>
  }

  <button type="submit" class="btn btn-primary" [disabled]="pending()">Add app</button>
</form>
