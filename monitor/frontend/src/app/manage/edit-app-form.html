@if (!editing()) {
  <button type="button" class="btn btn-small edit-toggle" #editToggle (click)="open()">Edit</button>
} @else {
  <form (submit)="onSubmit($event)">
    <div class="field">
      <label [for]="nameId">Name</label>
      <input
        [id]="nameId"
        type="text"
        required
        [value]="name()"
        (input)="onNameInput($event)"
        #nameField
      />
    </div>

    <div class="field">
      <label [for]="connectionStringId">New connection string</label>
      <input
        [id]="connectionStringId"
        type="password"
        autocomplete="new-password"
        [value]="connectionString()"
        (input)="onConnectionStringInput($event)"
        [attr.aria-describedby]="
          errorMessage() ? connectionStringHintId + ' ' + errorId : connectionStringHintId
        "
        [attr.aria-invalid]="errorMessage() ? 'true' : null"
      />
      <p [id]="connectionStringHintId" class="form-hint">{{ connectionStringHint }}</p>
    </div>

    <div class="field">
      <label [for]="pathPatternsId">Route patterns (one per line)</label>
      <textarea
        [id]="pathPatternsId"
        [value]="pathPatterns()"
        (input)="onPathPatternsInput($event)"
        [attr.aria-describedby]="
          errorMessage() ? pathPatternsHintId + ' ' + errorId : pathPatternsHintId
        "
      ></textarea>
      <p [id]="pathPatternsHintId" class="form-hint">
        {{ pathPatternsHint }} Example: <code>/</code>, <code>/articles/*</code>,
        <code>/history/:id</code>, each on its own line.
      </p>
    </div>

    @if (errorMessage(); as message) {
      <p [id]="errorId" class="form-error">{{ message }}</p>
    }

    <div class="actions">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="pending() || pathPatternsReadFailed()"
      >
        Save
      </button>
      <button type="button" class="btn cancel" (click)="cancel()">Cancel</button>
    </div>
  </form>
}
