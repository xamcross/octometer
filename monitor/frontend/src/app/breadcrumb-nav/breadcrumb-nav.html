<nav aria-label="Breadcrumb">
  <ol>
    @for (item of items(); track $index) {
      <li>
        @if (item.path !== null) {
          <a
            [routerLink]="item.path"
            style="display: inline-flex; align-items: center; min-width: 24px; min-height: 24px"
            >{{ item.label }}</a
          >
        } @else {
          <span aria-current="page">{{ item.label }}</span>
        }
      </li>
    }
  </ol>
</nav>
