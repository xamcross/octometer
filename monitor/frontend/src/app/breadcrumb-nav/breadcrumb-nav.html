<nav aria-label="Breadcrumb">
  <ol>
    @for (item of items(); track $index; let last = $last) {
      <li>
        @if (last) {
          <span aria-current="page">{{ item.label }}</span>
        } @else if (item.path !== null) {
          <a [routerLink]="item.path">{{ item.label }}</a>
        } @else {
          <span>{{ item.label }}</span>
        }
      </li>
    }
  </ol>
</nav>
