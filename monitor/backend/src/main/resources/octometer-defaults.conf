# The bundled defaults of D2 (docs/superpowers/specs/2026-09-21-octometer-design.md).
# octometer.monitor.config.loadConfig reads this file at the last precedence level.
#
# The name is octometer-defaults.conf, not application.conf. Ktor's own
# EngineMain reads a resource named application.conf by default; this file
# stays outside that lookup, so a later move to EngineMain cannot pick it
# up by accident.
#
# A value here holds no LOCALAPPDATA substitution. octometer.monitor.config
# builds the prod dataDir in code, from the injected environment map, so a
# test controls it and a runner with no LOCALAPPDATA variable still works.
octometer {
  mode = "prod"
  port = 7431
  retentionDays = 395
  pathValueCap = 200
  # Issue #295, D52, D56: the hosted-service keys. bind stays 127.0.0.1
  # on a desktop run; a Fly deploy sets OCTOMETER_BIND=0.0.0.0. The
  # secret keys stay empty by default; a desktop run needs none of
  # them. Issue #301 removes adminToken: the session rule of D52
  # replaces the temporary admin guard of issue #295.
  bind = "127.0.0.1"
  publicUrl = ""
  clientIpHeader = ""
  clusterUri = ""
  mailApiKey = ""
  # Issue #301, D52: the mail keys. mailSender and mailDir have no
  # bundled value here; ConfigLoader.kt computes each default in code,
  # from the resolved publicUrl and dataDir (the same pattern as
  # backupDir).
  mailFrom = "Octometer <no-reply@0ct0meter.com>"

  prod {
    settleLagSeconds = 60
    pollIntervalSeconds = 60
  }
  dev {
    settleLagSeconds = 2
    pollIntervalSeconds = 5
    dataDir = "build/dev-data"
  }
}
