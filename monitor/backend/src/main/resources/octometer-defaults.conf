# The bundled defaults of D2 (docs/superpowers/specs/2026-09-21-octometer-design.md).
# octometer.monitor.config.loadConfig reads this file at the last precedence level.
#
# The name is octometer-defaults.conf, not application.conf. Ktor's own
# EngineMain reads a resource named application.conf by default; this file
# stays outside that lookup, so a later move to EngineMain cannot pick it
# up by accident.
#
# A value here holds no LOCALAPPDATA substitution. octometer.monitor.config
# builds the prod dataDir in code, from the injected environment map, so a
# test controls it and a runner with no LOCALAPPDATA variable still works.
octometer {
  mode = "prod"
  port = 7431
  retentionDays = 395

  prod {
    settleLagSeconds = 60
  }
  dev {
    settleLagSeconds = 2
    dataDir = "build/dev-data"
  }
}
