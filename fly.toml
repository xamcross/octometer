# The Fly.io app of the hosted monitor (issue #295, D56).
#
# The deploy job of .github/workflows/ci.yml passes the app name with
# "--app", from the GitHub Actions repository variable FLY_APP_NAME.
# This file holds no "app" line (correction round of #307, MAJOR 2).
#
# Owner step: "flyctl volumes create octometer_data" makes the volume
# of [mounts] below.
#
# Two Fly secrets carry the values that this file never holds:
#   OCTOMETER_CLUSTER_URI    the Atlas connection string
#   OCTOMETER_MAIL_API_KEY   the Resend API key
# Issue #301 removes the admin guard token of issue #295; the session
# rule of D52 protects the service now.
primary_region = "<region>"
# m7: the memory budget is tight on 512 MB; this swap gives a margin
# under a poll spike.
swap_size_mb = 512

[build]
  dockerfile = "monitor/backend/Dockerfile"

[env]
  OCTOMETER_PUBLIC_URL = "https://app.0ct0meter.com"

[mounts]
  source = "octometer_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The poll loop must run at all times (issue #295, step 2); the
  # machine never stops on its own. m8: auto_start_machines stays
  # true; it starts no machine that auto_stop_machines ever stops.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"

[deploy]
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
