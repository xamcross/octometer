# JitPack build settings for the JVM kit (design decision D25, issue
# #37). JitPack publishes only kit/jvm-core, kit/jvm-mongo, and
# kit/jvm-ktor. JitPack never publishes monitor/backend and never
# publishes a tool.
#
# The list form of "jdk" comes from the JitPack documentation
# (docs.jitpack.io, page "Guide to publishing libraries", section
# "Java version", confirmed on 2026-09-22).
jdk:
  - openjdk21
install:
  - ./gradlew :kit:jvm-core:publishToMavenLocal :kit:jvm-mongo:publishToMavenLocal :kit:jvm-ktor:publishToMavenLocal -x test
