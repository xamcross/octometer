# JitPack build settings for the JVM kit (design decision D25, issue
# #37). JitPack publishes kit/jvm-core, kit/jvm-mongo, kit/jvm-ktor, and
# kit/jvm-spring (issue #69). JitPack never publishes monitor/backend and
# never publishes a tool.
#
# The list form of "jdk" comes from the JitPack documentation
# (docs.jitpack.io, page "Guide to publishing libraries", section
# "Java version", confirmed on 2026-09-22).
jdk:
  - openjdk21
install:
  # Issue #71 raises the version of gradle/libs.versions.toml
  # (octometer-kit) and pushes the release tag that JitPack builds
  # from this file.
  - ./gradlew :kit:jvm-core:publishToMavenLocal :kit:jvm-mongo:publishToMavenLocal :kit:jvm-ktor:publishToMavenLocal :kit:jvm-spring:publishToMavenLocal -x test
