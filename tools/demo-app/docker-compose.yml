# The MongoDB server of the demo app (issue #14, step 2). It binds to
# the loopback address only. The repository holds no real connection
# string; the demo app reads OCTOMETER_DEMO_MONGO_URI, with the loopback
# default of this file. The host port defaults to 27017. Set
# OCTOMETER_DEMO_MONGO_PORT for a different port, for example when a
# different MongoDB server already holds port 27017 on this machine.
services:
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:${OCTOMETER_DEMO_MONGO_PORT:-27017}:27017"
    volumes:
      - octometer-demo-mongo-data:/data/db

volumes:
  octometer-demo-mongo-data:
