# The test config of issue #68, decision 1: the app starts with no
# MongoDB server. This URI names a port with no listener, so the
# driver gets a fast refusal in the background, never a hang, and no
# code path here waits for it. A stray local MongoDB server on the
# default port must not hide this fact.
#
# The query holds a short serverSelectionTimeoutMS (release review of
# pull request #200, MAJOR 2). The test of that finding asks for the
# kit bean. That call runs a real createIndex command. The short value
# keeps the wait for that command under three seconds.
spring.data.mongodb.uri=mongodb://127.0.0.1:1/octometer-consumer-smoke?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000
