# The CI workflow of Octometer.
# Source: docs/superpowers/specs/2026-09-21-octometer-design.md, D39.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      jvm: ${{ steps.filter.outputs.jvm }}
      frontend: ${{ steps.filter.outputs.frontend }}
      tracker: ${{ steps.filter.outputs.tracker }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Issue #177, step 3. This filter picks the test job of each changed
      # module. A path that fits more than one filter stays in each filter
      # it fits. A doubtful path goes into the "jvm" filter: a run too many
      # costs less than a missed test (the owner's decision).
      - name: Detect the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            jvm:
              - 'kit/jvm-*/**'
              - 'monitor/backend/**'
              - 'tools/demo-app/**'
              - 'kit/tracker/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew*'
            frontend:
              - 'monitor/frontend/**'
            tracker:
              - 'kit/tracker/**'
            ci:
              - '.github/**'

  jvm:
    name: JVM modules
    needs: changes
    if: |
      github.event_name != 'schedule' &&
      (needs.changes.outputs.jvm == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # cache-read-only: issue #177, step 2. Only the "main" branch
          # writes new cache entries. Source: docs/setup-gradle.md of
          # gradle/actions v6.3.0, section "Using the cache read-only".
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Set up Node for the demo app tracker build
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: kit/tracker/.nvmrc
      # The task build already runs :tools:demo-app:test, because the demo
      # app is a project of the root build (Ktor review MINOR 7). A
      # separate step here would repeat that work.
      - name: Build each JVM module
        # MAJOR 3, Kotlin review of pull request #160. This job always
        # has Docker, so a skipped container test here is a real
        # problem. monitor/backend/build.gradle.kts reads this
        # variable and fails the build on a skip.
        env:
          OCTOMETER_REQUIRE_DOCKER: 'true'
        run: ./gradlew build
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-jvm
          path: |
            monitor/backend/build/reports/tests/test
            tools/demo-app/build/reports/tests/test

  monitor-windows:
    name: Monitor backend on Windows
    needs: changes
    if: |
      github.event_name != 'schedule' &&
      (needs.changes.outputs.jvm == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # cache-read-only: same source and rule as the "jvm" job above.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Test the monitor backend
        run: ./gradlew :monitor:backend:test
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-monitor-windows
          path: monitor/backend/build/reports/tests/test

  frontend:
    name: Frontend
    needs: changes
    if: |
      github.event_name != 'schedule' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: monitor/frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: monitor/frontend/.nvmrc
          cache: npm
          cache-dependency-path: monitor/frontend/package-lock.json
      - name: Install the frontend dependencies
        run: npm ci
      - name: Lint the frontend code
        run: npm run lint
      - name: Check the frontend format
        run: npm run format:check
      - name: Test the frontend code
        run: npm run test
      - name: Build the frontend
        run: npm run build

  tracker:
    name: Tracker
    needs: changes
    if: |
      github.event_name != 'schedule' &&
      (needs.changes.outputs.tracker == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kit/tracker
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: kit/tracker/.nvmrc
          cache: npm
          cache-dependency-path: kit/tracker/package-lock.json
      - name: Install the tracker dependencies
        run: npm ci
      - name: Type check the tracker code
        run: npm run typecheck
      - name: Test the tracker code
        run: npm test
      - name: Build the tracker
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks detect
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
