# The CI workflow of Octometer.
# Source: docs/superpowers/specs/2026-09-21-octometer-design.md, D39.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      jvm: ${{ steps.filter.outputs.jvm }}
      frontend: ${{ steps.filter.outputs.frontend }}
      tracker: ${{ steps.filter.outputs.tracker }}
      smoke: ${{ steps.filter.outputs.smoke }}
      e2e: ${{ steps.filter.outputs.e2e }}
      ci: ${{ steps.filter.outputs.ci }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A push to the private repository refuses an anonymous fetch of the
          # previous commit. Two commits in the clone remove the need to fetch.
          fetch-depth: 2
      # Issue #177, step 3. This filter picks the test job of each changed
      # module. A path that fits more than one filter stays in each filter
      # it fits. A doubtful path goes into the "jvm" filter: a run too many
      # costs less than a missed test (the owner's decision).
      - name: Detect the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            jvm:
              - 'kit/jvm-*/**'
              - 'monitor/backend/**'
              - 'tools/demo-app/**'
              - 'kit/tracker/**'
              - 'contract/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew*'
              - 'jitpack.yml'
            frontend:
              - 'monitor/frontend/**'
            # Issue #68, step 6. This filter starts the consumer-smoke job
            # of the two Spring Boot projects. Each root Gradle file counts,
            # because "./gradlew publishToMavenLocal" reads it.
            smoke:
              - 'tools/consumer-smoke/**'
              - 'kit/jvm-*/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew*'
            tracker:
              - 'kit/tracker/**'
              - 'contract/**'
            # Issue #175, step 4, decision 6. The "ci" filter below
            # already covers a workflow change, so this filter leaves
            # out '.github/**' (correction of the brief review).
            #
            # Issue #295, brief review M9, M10: the e2e job's image
            # check needs the Dockerfile and fly.toml too.
            e2e:
              - 'e2e/**'
              - 'monitor/**'
              - 'tools/demo-app/**'
              - 'kit/tracker/**'
              - 'kit/jvm-*/**'
              - 'contract/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew*'
              - 'monitor/backend/Dockerfile'
              - 'fly.toml'
            ci:
              - '.github/**'
            # Issue #295, brief review m1, m2: the deploy job's own
            # path filter.
            deploy:
              - 'monitor/backend/Dockerfile'
              - 'fly.toml'

  jvm:
    name: JVM modules
    needs: changes
    if: needs.changes.outputs.jvm == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # cache-read-only: issue #177, step 2. Only the "main" branch
          # writes new cache entries. Source: docs/setup-gradle.md of
          # gradle/actions v6.3.0, section "Using the cache read-only".
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Set up Node for the demo app tracker build
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: kit/tracker/.nvmrc
      # The task build already runs :tools:demo-app:test, because the demo
      # app is a project of the root build (Ktor review MINOR 7). A
      # separate step here would repeat that work.
      - name: Build each JVM module
        # MAJOR 3, Kotlin review of pull request #160. This job always
        # has Docker, so a skipped container test here is a real
        # problem. monitor/backend/build.gradle.kts reads this
        # variable and fails the build on a skip.
        env:
          OCTOMETER_REQUIRE_DOCKER: 'true'
        run: ./gradlew build
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-jvm
          path: |
            monitor/backend/build/reports/tests/test
            tools/demo-app/build/reports/tests/test

  consumer-smoke:
    name: Consumer smoke (${{ matrix.project.name }})
    needs: changes
    if: needs.changes.outputs.jvm == 'true' || needs.changes.outputs.smoke == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Issue #68. Each row is one consumer smoke project: a build tool
        # and its own directory. The step below picks the right command
        # for the tool of the row.
        project:
          - name: spring34-maven
            dir: tools/consumer-smoke/spring34-maven
            tool: maven
          - name: spring41
            dir: tools/consumer-smoke/spring41
            tool: gradle
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Publish the kit to mavenLocal()
        # Issue #68, decision 2. Each project reads the kit from the
        # local Maven repository at this coordinate, not from JitPack:
        # com.github.xamcross.octometer:octometer-kit-mongo:0.2.0.
        run: ./gradlew publishToMavenLocal
      - name: Test the Maven project
        if: matrix.project.tool == 'maven'
        working-directory: ${{ matrix.project.dir }}
        run: ./mvnw --batch-mode --no-transfer-progress test
      - name: Test the Gradle project
        if: matrix.project.tool == 'gradle'
        working-directory: ${{ matrix.project.dir }}
        run: ./gradlew test

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: monitor/frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: monitor/frontend/.nvmrc
          cache: npm
          cache-dependency-path: monitor/frontend/package-lock.json
      - name: Install the frontend dependencies
        run: npm ci
      - name: Lint the frontend code
        run: npm run lint
      - name: Check the frontend format
        run: npm run format:check
      - name: Test the frontend code
        run: npm run test
      - name: Build the frontend
        run: npm run build

  tracker:
    name: Tracker
    needs: changes
    if: needs.changes.outputs.tracker == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kit/tracker
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: kit/tracker/.nvmrc
          cache: npm
          cache-dependency-path: kit/tracker/package-lock.json
      - name: Install the tracker dependencies
        run: npm ci
      - name: Type check the tracker code
        run: npm run typecheck
      - name: Test the tracker code
        run: npm test
      - name: Build the tracker
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # cache-read-only: same source and rule as the "jvm" job above.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: e2e/.nvmrc
      # Issue #176, decision 4 (correction of the brief review,
      # 2026-09-27), step (a). "-PfrontendSourceMap=true" adds
      # "--source-map" to the Angular build of this job only, so
      # coverage-report.mjs can map the served bundle back to
      # monitor/frontend/src.
      # Issue #295, brief review M9, M10: installDist also builds
      # monitor/backend/build/install/backend, the image check step
      # below needs it.
      - name: Build the distribution and the demo app
        run: ./gradlew :monitor:backend:distZip :monitor:backend:installDist :tools:demo-app:installDist -PfrontendSourceMap=true
      # Issue #306, correction round, MAJOR 2: the removed Windows job was
      # the one job that ran these two classes after installDist. Each
      # class reads a built file only, so ubuntu runs it too.
      - name: Test the two distribution classes
        env:
          OCTOMETER_REQUIRE_DIST: 'true'
        run: >-
          ./gradlew :monitor:backend:test
          --tests 'octometer.monitor.frontend.FrontendCspTest'
          --tests 'octometer.monitor.windows.WindowsStartScriptTest'
      - name: Install the e2e dependencies
        working-directory: e2e
        run: npm ci
      # npm ci above runs first, so the cache key and the browser install
      # below both read the one pinned "@playwright/test" version of
      # e2e/package-lock.json, never a version that "npx" could fetch on
      # its own (a small, deliberate reorder of decision 6 of the brief).
      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install the Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      # Issue #176, decision 4, step (b). "jacocoAgentArgs" prints three
      # "KEY=value" lines (the monitor agent, the demo agent, the JaCoCo
      # CLI jar); each line appends straight into $GITHUB_ENV, so the
      # suite step below, and every later step of this job, read the
      # three variables.
      - name: Print the JaCoCo agent line of the monitor and of the demo app
        run: ./gradlew -q :monitor:backend:jacocoAgentArgs >> "$GITHUB_ENV"
      # Step (c).
      - name: Run the end-to-end suite
        working-directory: e2e
        run: npm test
      # Issue #295, criterion 3, brief review M9, M10: the image builds
      # in CI and answers ok on /healthz in a container. The empty
      # folder below reproduces the Fly volume state of brief review
      # B5 (a root-owned mount); the entrypoint script fixes the
      # ownership. This end-to-end suite of the monitor itself stays
      # on the host; only this one check runs in the container.
      - name: Build the Docker image and check its health route
        run: |
          docker build -f monitor/backend/Dockerfile -t octometer-monitor:ci .
          mkdir image-check-data
          docker run --rm -d --name octometer-image-check \
            -p 8080:8080 \
            -v "$PWD/image-check-data:/data" \
            octometer-monitor:ci
          health_ready=""
          for attempt in $(seq 1 30); do
            if [ "$(curl -fsS http://127.0.0.1:8080/healthz)" = "ok" ]; then
              health_ready="yes"
              break
            fi
            sleep 1
          done
          docker logs octometer-image-check
          docker stop octometer-image-check
          if [ -z "$health_ready" ]; then
            echo "The image never answered ok on /healthz within 30 seconds."
            exit 1
          fi
      # Step (d). Converts the V8 coverage of the browser suite into one
      # lcov file and one text summary of monitor/frontend/src.
      - name: Build the frontend coverage report
        run: node e2e/scripts/coverage-report.mjs
      # Step (e). Merges the two JaCoCo destfiles of the JVM suite run
      # (the monitor process, the demo app process) into one report.
      - name: Merge the JVM coverage of the e2e run
        run: ./gradlew :monitor:backend:jacocoE2eReport
      # Step (f). if: always(), so a failed suite still keeps each report.
      - name: Keep the Playwright report and the coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.run/coverage
            monitor/backend/build/reports/jacoco/e2e

  # Issue #295: the deploy job. It runs on a push to main only, after
  # the other jobs pass or skip, and only on a change that the deploy
  # path filter covers. Brief review M1: this job lists "changes" in
  # "needs" too, because the "needs" context of a job does not carry
  # through a chain.
  deploy:
    name: Deploy
    needs: [changes, jvm, frontend, e2e]
    if: |
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.jvm.result != 'failure' && needs.frontend.result != 'failure' && needs.e2e.result != 'failure' &&
      (needs.changes.outputs.jvm == 'true' || needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.deploy == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # cache-read-only: same source and rule as the "jvm" job above.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Brief review M2: installDist builds the Angular app first.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: monitor/frontend/.nvmrc
      - name: Build the distribution, with the Angular app inside it
        run: ./gradlew :monitor:backend:installDist
      # Brief review m3: the token presence, never the token value, so
      # a fork pull request or a missing owner secret never fails
      # main. m12: id: token, the step that the "if" below reads.
      #
      # Correction round of #307, MAJOR 2: "present" also needs the
      # repository variable FLY_APP_NAME and a real region in fly.toml,
      # or flyctl deploy fails with no app name and no region.
      - name: Read the deploy readiness
        id: token
        run: |
          reason=""
          if [ "${{ secrets.FLY_API_TOKEN != '' }}" != "true" ]; then
            reason="no FLY_API_TOKEN"
          elif [ -z "${{ vars.FLY_APP_NAME }}" ]; then
            reason="no FLY_APP_NAME"
          elif grep -q 'primary_region = "<' fly.toml; then
            reason="no region in fly.toml"
          fi
          if [ -z "$reason" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up flyctl
        if: steps.token.outputs.present == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@dfdfedc86b296f5e5384f755a18bf400409a15d0 # v1.4
      # Brief review M7: --ha=false, because fly.toml names one volume
      # and one machine; the run guide states the reason. Correction
      # round of #307, MAJOR 2: --app names the Fly app, because
      # fly.toml holds no "app" line.
      - name: Deploy to Fly.io
        if: steps.token.outputs.present == 'true'
        run: flyctl deploy --remote-only --ha=false --app "${{ vars.FLY_APP_NAME }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Report the skipped deploy
        if: steps.token.outputs.present != 'true'
        run: |
          echo "The deploy is skipped: ${{ steps.token.outputs.reason }}."

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks detect
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
