# The secret scan of this repository.
#
# Source: https://github.com/gitleaks/gitleaks (the README of the master
# branch, section "Configuration"), read on 2026-09-21.
#
# [extend] adds this file to the default rule set of gitleaks. useDefault
# keeps each built-in rule. The default rules cover a token of a common
# provider, for example a GitHub token, an AWS key, and a private key.
# The rule below adds one more rule, for a MongoDB URI with a password.
# A URI of a different service, for example redis:// or postgres://,
# needs a rule of its own in a later issue.

[extend]
useDefault = true

[[rules]]
id = "mongodb-uri-password"
description = "A MongoDB connection string that holds a plain user name and a plain password."
# The prefix (?i) makes the match case-insensitive. Go's regexp package
# (RE2) accepts this flag; the gitleaks README shows the same flag in an
# example allowlist regex. Source: the gitleaks README of the master
# branch, section "Configuration", read on 2026-09-21.
regex = '''(?i)mongodb(?:\+srv)?://[A-Za-z0-9._%+-]+:[^@\s/]+@[A-Za-z0-9.-]+'''
keywords = ["mongodb"]
tags = ["mongodb", "connection-string", "credentials"]

# The angle-bracket placeholder form, for example
# mongodb+srv://<user>:<password>@<host>/<db>, does not match the regex
# above. The user-name group excludes "<" and ">". The flag (?i) changes
# only the letter case of the match; it does not add "<" or ">" to the
# group, so a document of this repository can still show the placeholder
# form without a finding.

[[rules.allowlists]]
description = "One fake URI. It is not a real credential. It is a test fixture. A future test of the CI job `secrets` (issue #7), or of kit/jvm-mongo, can stage this exact string to check the rule and the allowlist."
regexes = [
  '''mongodb\+srv://octotest:S3cr3t-Test-Only@cluster0\.example\.mongodb\.net$''',
]

# The persistent form of issue #171 (a `paths` entry survives a squash
# merge; a `.gitleaksignore` fingerprint of a commit does not). An
# early commit of pull request #195 (issue #28) built a test with a
# literal MongoDB URI of this rule's own shape, before a later commit
# of that same pull request moved the test to the one fake URI above.
# gitleaks still scans the early commit's own diff, thus this entry
# stays needed for this one test file, never a real credential.
#
# `targetRules` on a top-level `[[allowlists]]` needs gitleaks 8.25.0
# (the gitleaks README, section "Configuration", read on 2026-09-26:
# "In v8.25.0 `[allowlist]` was replaced with `[[allowlists]]`", with
# `targetRules` shown only from that version on). The CI job "Secret
# scan" of `.github/workflows/ci.yml` pins `gitleaks/gitleaks-action`
# at the commit tagged `v3.0.0`; its own log line "gitleaks version:
# 8.24.3" (read on 2026-09-26) names the installed CLI version, one
# minor version before 8.25.0. This repository therefore keeps the
# rule-scoped `[[rules.allowlists]]` form, with `regexes`, a field this
# version already supports (the same README, the `[[rules.allowlists]]`
# examples).
[[rules.allowlists]]
description = "A fake connection string of an early commit of pull request #195 (issue #28), a test fixture, never a real credential."
regexes = [
  '''mongodb\+srv://octomarkeruriuserf7b2:octomarkeruripassf7b2@cluster0\.example\.mongodb\.net$''',
]
